<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 起名平台</title>
  <style>
    :root { --brand: #0f8b8d; --ink: #17252a; --muted: #6b7c85; --line: #e4ebee; --bg: #f6f9fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: .5px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: 0 1px 2px rgba(23,37,42,.04); }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    textarea { width: 100%; min-height: 92px; resize: vertical; padding: 12px 14px; font-size: 15px; line-height: 1.6;
      border: 1px solid var(--line); border-radius: 10px; outline: none; font-family: inherit; }
    textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15,139,141,.12); }
    .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
    select { padding: 10px 12px; font-size: 14px; border: 1px solid var(--line); border-radius: 10px;
      background: #fff; color: var(--ink); font-family: inherit; outline: none; }
    select:focus { border-color: var(--brand); }
    button { background: var(--brand); color: #fff; border: 0; border-radius: 10px; padding: 11px 22px; font-size: 15px;
      cursor: pointer; font-family: inherit; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .hint { color: var(--muted); font-size: 13px; }
    .out { margin-top: 24px; white-space: pre-wrap; line-height: 1.9; font-size: 15px; min-height: 40px; }
    .out.streaming::after { content: "▌"; color: var(--brand); animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .hist { margin-top: 34px; }
    .hist h2 { font-size: 16px; margin: 0 0 12px; }
    .item { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .item .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; gap: 10px; }
    .item .req { font-weight: 600; margin-bottom: 6px; }
    .item .res { font-size: 14px; color: #33484f; white-space: pre-wrap; line-height: 1.7; }
    .empty { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AI 起名平台</h1>
    <p class="sub">输入你的需求（如：男孩、国风、简约），AI 会一边生成一边把 3 组名字和寓意显示出来。</p>

    <div class="card">
      <label for="req">起名需求</label>
      <textarea id="req" placeholder="例如：女孩，出生在秋天，气质温柔，两个字"></textarea>
      <div class="row">
        <select id="model" aria-label="选择模型"></select>
        <button id="go">开始起名</button>
        <span class="hint" id="status"></span>
      </div>
      <div class="out" id="out"></div>
    </div>

    <div class="hist">
      <h2>起名历史</h2>
      <div id="hist"><p class="empty">加载中…</p></div>
    </div>
  </div>

  <script>
    const reqEl = document.getElementById('req');
    const outEl = document.getElementById('out');
    const goEl = document.getElementById('go');
    const statusEl = document.getElementById('status');
    const histEl = document.getElementById('hist');
    const modelEl = document.getElementById('model');

    async function loadModels() {
      try {
        const r = await fetch('/api/models');
        const list = await r.json();
        if (!Array.isArray(list)) throw new Error('模型列表格式不正确');
        modelEl.innerHTML = list.map(function (m) {
          return '<option value="' + m.key + '"' + (m.configured ? '' : ' disabled') + '>' +
            m.label + (m.configured ? '' : '（未配置密钥）') + '</option>';
        }).join('');
        const firstOk = list.find(function (m) { return m.configured; });
        if (firstOk) modelEl.value = firstOk.key;
      } catch (e) {
        modelEl.innerHTML = '<option value="doubao">豆包（火山方舟）</option>';
      }
    }

    async function loadHistory() {
      try {
        const r = await fetch('/api/history');
        const data = await r.json();
        if (!Array.isArray(data) || data.length === 0) {
          histEl.innerHTML = '<p class="empty">还没有记录，起一个名字试试。</p>';
          return;
        }
        histEl.innerHTML = data.map(function (h) {
          const time = new Date(h.created_at).toLocaleString('zh-CN');
          return '<div class="item">' +
            '<div class="meta"><span>' + time + '</span><span>模型：' + (h.model_name || '-') + '</span></div>' +
            '<div class="req">' + escapeHtml(h.user_requirement) + '</div>' +
            '<div class="res">' + escapeHtml(h.name_result) + '</div>' +
            '</div>';
        }).join('');
      } catch (e) {
        histEl.innerHTML = '<p class="empty">历史加载失败：' + e.message + '</p>';
      }
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    async function start() {
      const requirement = reqEl.value.trim();
      if (!requirement) {
        statusEl.textContent = '请先填写需求';
        return;
      }
      goEl.disabled = true;
      outEl.textContent = '';
      outEl.classList.add('streaming');
      statusEl.textContent = '生成中…（' + modelEl.options[modelEl.selectedIndex].textContent + '）';

      try {
        const r = await fetch('/api/name', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requirement: requirement, model: modelEl.value }),
        });

        if (!r.ok) {
          const txt = await r.text();
          outEl.classList.remove('streaming');
          outEl.textContent = '请求失败：' + txt;
          statusEl.textContent = '';
          return;
        }

        const reader = r.body.getReader();
        const decoder = new TextDecoder('utf-8');
        while (true) {
          const chunk = await reader.read();
          if (chunk.done) break;
          outEl.textContent += decoder.decode(chunk.value, { stream: true });
        }
        outEl.classList.remove('streaming');
        statusEl.textContent = '完成';
        loadHistory();
      } catch (e) {
        outEl.classList.remove('streaming');
        outEl.textContent += '\n[出错：' + e.message + ']';
        statusEl.textContent = '';
      } finally {
        goEl.disabled = false;
      }
    }

    goEl.addEventListener('click', start);
    reqEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) start();
    });

    loadModels();
    loadHistory();
  </script>
</body>
</html>
